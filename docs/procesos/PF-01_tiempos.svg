<text x="56" y="64" font-size="28" font-weight="600" fill="#141822" text-anchor="start" letter-spacing="-0.4">El flujo reproducible tomó 9.9 minutos; el manual se estima en 95.0.</text>
<text x="56" y="102" font-size="28" font-weight="600" fill="#636975" text-anchor="start" letter-spacing="-0.4">Ahorro indicativo de 85.1 minutos (89.6 %) frente a la estimación manual.</text>
<text x="56" y="138" font-size="15" font-weight="400" fill="#636975" text-anchor="start">Minutos por actividad, desde la publicación del boletín hasta los indicadores validados. AS-IS estimado por el autor; TO-BE medido el 2026-10-19.</text>
