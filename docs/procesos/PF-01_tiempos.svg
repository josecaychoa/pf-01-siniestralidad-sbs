<text x="56" y="504" font-size="13" font-weight="400" fill="#636975" text-anchor="start">repositorio, que reprocesa los 9 cortes e incluye la pausa de 2 s entre descargas, más 6 min estimados de lectura de las dos notas de validación. Equipo:</text>
<text x="56" y="524" font-size="13" font-weight="400" fill="#636975" text-anchor="start">Intel Core i7-1355U, 15.7 GB de RAM, Windows 11 Pro y Oracle Database 23ai Free 23.6. Detalle en docs/procesos/PF-01_tiempos.csv. Elaboración propia.</text>
