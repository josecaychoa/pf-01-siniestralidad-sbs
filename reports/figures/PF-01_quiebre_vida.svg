<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PF-01 · Siniestros mensuales de Vida Individual de Largo Plazo, enero de 2025 a agosto de 2026</title>
<desc id="d">Siniestros mensuales de Vida Individual de Largo Plazo: promedio de 9.5 millones de soles de enero de 2025 a febrero de 2026, 310.6 millones en marzo de 2026 y promedio de 120.9 millones de abril a agosto de 2026.</desc>
<rect width="1200" height="718" fill="#FFFFFF"/>
<text x="56" y="64" font-size="28" font-weight="600" fill="#141822" text-anchor="start" letter-spacing="-0.4">Los siniestros de Vida Individual de Largo Plazo saltaron en marzo de 2026.</text>
<text x="56" y="102" font-size="28" font-weight="600" fill="#636975" text-anchor="start" letter-spacing="-0.4">Ese mes, la SBS empezó a incluir «otras obligaciones» por un cambio contable.</text>
<text x="56" y="138" font-size="15" font-weight="400" fill="#636975" text-anchor="start">Siniestros netos del mes, en millones de soles. Promedio de 9.5 antes de marzo de 2026 y de 120.9 de abril a agosto.</text>
