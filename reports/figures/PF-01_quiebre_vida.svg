<text x="835.688" y="251.73" font-size="12" font-weight="400" fill="#2A5CDA" text-anchor="end">Desde marzo de 2026: Resolución SBS N.º 00085-2026.</text>
<text x="835.688" y="269.73" font-size="12" font-weight="400" fill="#2A5CDA" text-anchor="end">El cuadro S-402 pasa a incluir</text>
<text x="835.688" y="287.73" font-size="12" font-weight="400" fill="#2A5CDA" text-anchor="end">«otras obligaciones».</text>
<text x="56" y="554" font-size="13" font-weight="400" fill="#636975" text-anchor="start"><tspan font-style="italic">Nota.</tspan> Elaboración propia con datos de SBS (s. f.-c, s. f.-d, 2026). Siniestros del mes = acumulado del mes menos el del mes anterior del mismo año, en</text>
<text x="56" y="574" font-size="13" font-weight="400" fill="#636975" text-anchor="start">millones de soles. Desde marzo de 2026 el cuadro S-402 se titula «Siniestros de Primas de Seguros y Otras Obligaciones Netos» y su nota 1/ remite a la</text>
<text x="56" y="594" font-size="13" font-weight="400" fill="#636975" text-anchor="start">Resolución SBS N.º 085-2026.</text>
