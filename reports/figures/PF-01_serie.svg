<title id="t">PF-01 · Índice de siniestralidad del sistema asegurador peruano, 2019-2026</title>
<desc id="d">Siniestralidad directa de 53.0 % en diciembre de 2019 a 48.9 % en agosto de 2026, con un máximo de 59.3 % en diciembre de 2021; retenida de 46.0 % a 45.7 %.</desc>
<rect width="1200" height="670" fill="#FFFFFF"/>
<text x="56" y="64" font-size="28" font-weight="600" fill="#141822" text-anchor="start" letter-spacing="-0.4">La siniestralidad directa del sistema subió a 48.9 % en agosto de 2026.</text>
<text x="56" y="102" font-size="28" font-weight="600" fill="#636975" text-anchor="start" letter-spacing="-0.4">Son 7.5 puntos más que en agosto de 2025; la retenida llegó a 45.7 %.</text>
<text x="56" y="138" font-size="15" font-weight="400" fill="#636975" text-anchor="start">Índice del sistema en porcentaje: siniestros entre primas acumulados al corte. Diciembre acumula 12 meses; agosto, 8 (puntos huecos).</text>
