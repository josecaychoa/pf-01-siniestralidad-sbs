[project]
name = "plantilla-proyecto-datos"
version = "0.1.0"
description = "PF-XX · <Titulo del proyecto>"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17", "pre-commit>=4.6", "pypdf>=6"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
