[project]
name = "pf-01-siniestralidad-sbs"
version = "0.1.0"
description = "PF-01 · Producción y siniestralidad por riesgo del mercado asegurador peruano, 2019-2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "oracledb==26.0.1",
    "pandas==3.0.6",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "pre-commit>=4.6",
    "pypdf>=6",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
